# ============================================================================
# Options: input and history
# ============================================================================
set-option -s escape-time 10
set-option -g focus-events on
set-option -g mouse on
set-window-option -g mode-keys vi
set-option -g prefix C-a
set-option -g prefix2 M-a
set-option -g history-limit 10000

# ============================================================================
# Options: windows and panes
# ============================================================================
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-passthrough on
# leader+{       --> swap panes
# leader+<space> --> switch pane layout, e.g horizontal to vertical

# ============================================================================
# Options: terminal and true colour
# ============================================================================
# tmux-256color supports background colour erase; advertise RGB to outer terminals.
set-option -g default-terminal "tmux-256color"
set-option -s -a terminal-overrides ',xterm-ghostty:RGB'
set-option -s -a terminal-overrides ',wezterm:RGB'

# ============================================================================
# Theme
# ============================================================================
if-shell "test -e ~/dotfiles/tmux/theme.tmux.conf" "source-file ~/dotfiles/tmux/theme.tmux.conf"

# ============================================================================
# Keybindings: prefix and configuration
# ============================================================================
# Press the prefix twice to send Ctrl-a to the application.
bind-key C-a send-keys C-a
bind-key -n C-l send-keys C-l
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# ============================================================================
# Keybindings: sessions and windows
# ============================================================================
bind-key 0 choose-session
bind-key S choose-tree
bind-key -n M-p previous-window
bind-key -n M-n next-window
bind-key -r Tab select-window -l
bind-key c new-window -c "#{pane_current_path}" -n "wip"
bind-key C new-window -a -c "#{pane_current_path}"
bind-key g new-window -c "#{pane_current_path}" lazygit
# Start with an empty prompt instead of pre-filling the current window name.
bind-key , command-prompt -p "Rename window:" { rename-window "%%" }

# ============================================================================
# Keybindings: panes
# ============================================================================
bind-key q kill-pane
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 10
bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r L resize-pane -R 10

# ============================================================================
# Keybindings: copy, paste and search
# ============================================================================
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key P paste-buffer
bind-key / copy-mode \; send-keys ?

# ============================================================================
# Plugins: options and initialization
# ============================================================================
# Install: prefix + I; update: prefix + u; uninstall: prefix + Alt-u.
set-option -g @plugin 'sainnhe/tmux-fzf'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'wfxr/tmux-fzf-url'

# tmux-fzf takes over prefix + S from choose-tree above.
TMUX_FZF_MENU_POPUP=1
TMUX_FZF_MENU_POPUP_WIDTH=70%
TMUX_FZF_MENU_POPUP_HEIGHT=70%
TMUX_FZF_LAUNCH_KEY="S"
TMUX_FZF_ORDER="session|window|pane"

set-option -g @resurrect-capture-pane-contents 'on'

# prefix + x to pick URLs
set-option -g @fzf-url-bind 'x'
# Match ~/, ./, ../ and / paths after whitespace/quote/(/=; segments can't end in "." so trailing punctuation is dropped.
set-option -g @fzf-url-custom-pat '(?:^|[\s\x22\x27\x60(=])((?:~|\.{1,2})?/[\w.+@%-]*[\w+@%-](?:/[\w.+@%-]*[\w+@%-])*)'
set-option -g @fzf-url-custom-sub '$1'
run-shell '/opt/zerobrew/opt/tpm/share/tpm/tpm'

# ============================================================================
# Keybindings: sesh session picker
# ============================================================================
# https://github.com/joshmedeski/sesh#tmux--fzf
bind-key o run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux --color=bg:#14161b,fg:white,hl:white,bg+:#14161b,fg+:white,hl+:white -p 85%,75% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^x tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-x:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview --watch {}'
)\""
