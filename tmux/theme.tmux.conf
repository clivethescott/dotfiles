# ============================================================================
# Status bar: WezTerm colours and layout
# ============================================================================
set-option -g status-position top
# Leave a blank row between the status bar and pane content.
set-option -g status 2
set-option -g 'status-format[1]' ''
set-option -g status-style "bg=#14161b,fg=#626262"
# Centre across the full terminal, independently of the session/directory width.
set-option -g status-justify absolute-centre
set-option -g status-left-length 80
set-option -g status-right-length 0
set-option -g status-right ""

# ============================================================================
# Session and directory
# ============================================================================
# Reverse the session while prefix is held.
set-option -g status-left "#[fg=#b3f6c0]#{?client_prefix,#[reverse],} #S #[default]│ #{=/-32/...:#{b:pane_current_path}} "

# ============================================================================
# Window names and selection
# ============================================================================
# Default to fish; keep explicit window names.
set-window-option -g automatic-rename on
set-option -g automatic-rename-format "fish"
set-window-option -g window-status-style "bg=#14161b,fg=#626262,none"
set-window-option -g window-status-last-style "bg=#14161b,fg=#626262,none"
set-window-option -g window-status-current-style "bg=#14161b,fg=#b3f6c0,none"
set-window-option -g window-status-activity-style "bg=#14161b,fg=#626262,none"
set-window-option -g window-status-bell-style "bg=#14161b,fg=#626262,none"
set-window-option -g window-status-separator " "
set-window-option -g window-status-format " #I: #W#{?window_zoomed_flag, [Z],} "
set-window-option -g window-status-current-format " #I: #W#{?window_zoomed_flag, [Z],} "

# ============================================================================
# Pane borders
# ============================================================================
set-window-option -g pane-border-status off
set-window-option -g pane-border-lines single
set-window-option -g pane-border-style "bg=default,fg=#484848"
set-window-option -g pane-active-border-style "bg=default,fg=#b3f6c0"

# ============================================================================
# Messages and copy mode
# ============================================================================
# Clear status text behind prompts and messages.
set-option -g message-style "bg=#14161b,fg=#b3f6c0,fill=#14161b"
set-option -g message-command-style "bg=#14161b,fg=#b3f6c0,fill=#14161b"
set-window-option -g mode-style "bg=#b3f6c0,fg=#14161b"
