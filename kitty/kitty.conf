# Ghostty/WezTerm appearance with native splits. Leader: Cmd+A, then a key.
font_family JetBrainsMono NFM
bold_font auto
italic_font auto
bold_italic_font auto
font_size 17
background #14161b
foreground #e0e2ea
selection_background #4f5258
selection_foreground #e0e2ea
cursor #b55a5a
cursor_text_color #ffffff
color0 #07080d
color1 #ffc0b9
color2 #b3f6c0
color3 #fce094
color4 #a6dbff
color5 #ffcaff
color6 #8cf8f7
color7 #eef1f8
color8 #4f5258
color9 #ffc0b9
color10 #b3f6c0
color11 #fce094
color12 #a6dbff
color13 #ffcaff
color14 #8cf8f7
color15 #eef1f8

hide_window_decorations titlebar-only
remember_window_size yes
initial_window_width 120c
initial_window_height 35c
window_padding_width 10
window_border_width 1
draw_minimal_borders yes
active_border_color #fab387
inactive_border_color #626262
inactive_text_alpha 0.5
enabled_layouts splits,stack
enable_audio_bell no
visual_bell_duration 0
scrollback_lines 10000
mouse_hide_wait -1
copy_on_select clipboard
macos_option_as_alt both
macos_quit_when_last_window_closed yes
shell /opt/zerobrew/bin/fish
shell_integration enabled no-title

tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_align center
tab_bar_margin_height 0 8
tab_bar_background #14161b
active_tab_background #14161b
inactive_tab_background #14161b
active_tab_foreground #b3f6c0
inactive_tab_foreground #626262
active_tab_font_style normal
inactive_tab_font_style normal
tab_title_template " {session_name + ' │ ' if session_name else ''}{index}: {title}{' [Z]' if layout_name == 'stack' and num_windows > 1 else ''} "
tab_bar_filter session:~ or session:^$
startup_session ~/.config/kitty/sessions/home.kitty-session

# Cmd+letter acts as Ctrl+letter; Cmd+A is reserved for the leader.
clear_all_shortcuts yes
map cmd+b send_text all \x02
map cmd+c send_text all \x03
map cmd+d send_text all \x04
map cmd+e send_text all \x05
map cmd+f send_text all \x06
map cmd+g send_text all \x07
map cmd+h send_text all \x08
map cmd+i send_text all \x09
map cmd+j send_text all \x0a
map cmd+k send_text all \x0b
map cmd+l send_text all \x0c
map cmd+m send_text all \x0d
map cmd+n send_text all \x0e
map cmd+o send_text all \x0f
map cmd+p send_text all \x10
map cmd+q send_text all \x11
map cmd+r send_text all \x12
map cmd+s send_text all \x13
map cmd+t send_text all \x14
map cmd+u send_text all \x15
map cmd+v send_text all \x16
map cmd+w send_text all \x17
map cmd+x send_text all \x18
map cmd+y send_text all \x19
map cmd+z send_text all \x1a
map cmd+[ send_text all \x1b
map cmd+] send_text all \x1b
map cmd+6 send_text all \x1e
map cmd+period send_text all \x1b[46;5u
map cmd+backslash send_text all \x1b[92;5u
map alt+3 send_text all #
map shift+enter send_text all \x1b\r

map cmd+shift+c copy_to_clipboard
map cmd+shift+v paste_from_clipboard
map cmd+shift+r load_config_file
map cmd+shift+f show_scrollback
map cmd+alt+q quit
map cmd+minus change_font_size all -1
map cmd+equal change_font_size all +1
map cmd+shift+equal change_font_size all 0
map cmd+left resize_window narrower 2
map cmd+right resize_window wider 2
map cmd+up resize_window taller 2
map cmd+down resize_window shorter 2
map alt+p previous_tab
map alt+n next_tab
map cmd+shift+d detach_window new-tab

map cmd+a>cmd+a send_text all \x01
map cmd+a>a send_text all \x01
map cmd+a>escape no_op
map cmd+a>r load_config_file
map cmd+a>colon command_palette

# Tabs inherit the current directory and session.
map cmd+a>c new_tab_with_cwd
map cmd+a>shift+c combine : new_tab_with_cwd : set_tab_title
map cmd+a>comma set_tab_title
map cmd+a>n next_tab
map cmd+a>p previous_tab
map cmd+a>tab goto_tab 0
map cmd+a>1 goto_tab 1
map cmd+a>2 goto_tab 2
map cmd+a>3 goto_tab 3
map cmd+a>4 goto_tab 4
map cmd+a>5 goto_tab 5
map cmd+a>6 goto_tab 6
map cmd+a>7 goto_tab 7
map cmd+a>8 goto_tab 8
map cmd+a>9 goto_tab 9
map cmd+a>t select_tab
map cmd+a>g launch --type=tab --cwd=current --add-to-session=. --tab-title=lazygit lazygit
map cmd+a>m detach_window new-tab
map cmd+a>shift+m detach_window new
map cmd+a>shift+n new_os_window_with_cwd
map cmd+a>u toggle_maximized

# v = right; s = below; stack temporarily zooms the active pane.
map cmd+a>v launch --location=vsplit --cwd=current --add-to-session=.
map cmd+a>s launch --location=hsplit --cwd=current --add-to-session=.
map cmd+a>h neighboring_window left
map cmd+a>j neighboring_window down
map cmd+a>k neighboring_window up
map cmd+a>l neighboring_window right
map cmd+a>shift+h resize_window narrower 10
map cmd+a>shift+j resize_window shorter 10
map cmd+a>shift+k resize_window taller 10
map cmd+a>shift+l resize_window wider 10
map cmd+a>z toggle_layout stack
map cmd+a>space next_layout
map cmd+a>equal reset_window_sizes
map cmd+a>f focus_visible_window
map cmd+a>shift+[ swap_with_window
map cmd+a>q close_window_with_confirmation ignore-shell
# x follows tmux's URL picker convention; Shift+X closes a pane.
map cmd+a>x kitten hints --type=url
map cmd+a>shift+x close_window_with_confirmation ignore-shell

# Scrollback pager: / searches, n repeats, q exits.
map cmd+a>[ show_scrollback
map cmd+a>slash show_scrollback
map cmd+a>shift+p paste_from_clipboard
map cmd+a>backslash kitten hints --type=path

# Native sessions: save only this project's tabs, not other active projects.
map cmd+a>o goto_session ~/.config/kitty/sessions
map cmd+a>0 goto_session --active-only
map cmd+a>shift+s save_as_session --match=session:~ --base-dir ~/.config/kitty/sessions
map cmd+a>ctrl+s save_as_session --match=session:~ .
map cmd+a>minus goto_session -1
